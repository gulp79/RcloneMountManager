; ============================================================
; REMOTE RCLONE CONFIGURATION FILE (SAMPLE)
; Copy this file, rename it (e.g., gdrive.properties), and edit it.
; ============================================================

[General]
; Display name shown in the UI
name = Google Drive Personal

; The name of the remote as defined in rclone.conf (e.g., gdrive:)
remote_name = gdrive:

; Windows: Drive letter (e.g., X:\) or "auto".
; Linux: Full path (e.g., /mnt/gdrive)
mountpoint = X:

; Volume name shown in File Explorer
volname = GDrive

[Rclone]
; Optional config path (if empty, uses system default or local rclone.conf)
config_path = rclone.conf

; Additional fixed flags (not quickly editable from UI)
extra_flags = --network-mode --no-modtime

[Defaults]
; Default values loaded into the UI (modifiable at runtime)
vfs_cache_mode = full
vfs_cache_max_age = 30m
dir_cache_time = 1m
buffer_size = 16M
