; ============================================================
; FILE DI CONFIGURAZIONE REMOTE RCLONE (SAMPLE)
; Copia questo file, rinominalo (es. gdrive.properties) e editalo.
; ============================================================

[General]
; Nome visualizzato nella UI
name = Google Drive Personal
; Il nome del remote come definito in rclone.conf (es. gdrive:)
remote_name = gdrive:
; Windows: Lettera drive (es. X:) o "auto". Linux: Path completo (es. /mnt/gdrive)
mountpoint = X:
; Nome del volume visualizzato in Risorse del Computer
volname = GDrive

[Rclone]
; Config path opzionale (se vuoto usa default di sistema o rclone.conf locale)
config_path = rclone.conf
; Flags aggiuntivi fissi (non modificabili da UI rapidamente)
extra_flags = --network-mode --no-modtime

[Defaults]
; Valori di default caricati nella UI (modificabili a runtime)
vfs_cache_mode = full
vfs_cache_max_age = 30m
dir_cache_time = 1m
buffer_size = 16M