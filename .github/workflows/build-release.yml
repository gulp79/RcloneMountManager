name: Build & Release RcloneMountManager

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Sistema operativo runner"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - ubuntu

  push:
    tags:
      - "v*.*.*"   # build automatica su TAG (Windows + Linux)

permissions:
  contents: write

env:
  APP_NAME: RcloneMountManager
  ENTRYPOINT: RcloneMountManager.py
  ICON_FILE: icon.ico
  PY_VERSION: "3.12"

jobs:
  # ==========================================================
  # BUILD ON DEMAND (manuale) - PyInstaller only
  # ==========================================================
  build_on_demand:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Manual build (PyInstaller on ${{ inputs.os }})"
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          pip install pyinstaller
        shell: bash

      - name: Build with PyInstaller (Windows)
        if: ${{ startsWith(runner.os,'Windows') }}
        run: >
          pyinstaller --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon="${{ env.ICON_FILE }}"
          "${{ env.ENTRYPOINT }}"

      - name: Build with PyInstaller (Linux)
        if: ${{ startsWith(runner.os,'Linux') }}
        run: >
          pyinstaller --onefile
          --name "${{ env.APP_NAME }}"
          "${{ env.ENTRYPOINT }}"

      - name: Collect artifact
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/${{ env.APP_NAME }}.exe" "release/${{ env.APP_NAME }}_pyinstaller_Windows.exe"
          else
            mv "dist/${{ env.APP_NAME }}" "release/${{ env.APP_NAME }}_pyinstaller_Linux"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP_NAME }}_pyinstaller_${{ runner.os }}"
          path: release/*

  # ==========================================================
  # BUILD + RELEASE ON TAG (Windows + Linux) - PyInstaller only
  # ==========================================================
  build_for_tag:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    name: "Tag build (${{ github.ref_name }})"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          pip install pyinstaller
        shell: bash

      - name: Build with PyInstaller (Windows)
        if: ${{ startsWith(matrix.os,'windows') }}
        run: >
          pyinstaller --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --icon="${{ env.ICON_FILE }}"
          "${{ env.ENTRYPOINT }}"

      - name: Build with PyInstaller (Linux)
        if: ${{ startsWith(matrix.os,'ubuntu') }}
        run: >
          pyinstaller --onefile
          --name "${{ env.APP_NAME }}"
          "${{ env.ENTRYPOINT }}"

      - name: Collect artifact
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/${{ env.APP_NAME }}.exe" "release/${{ env.APP_NAME }}_pyinstaller_Windows_${{ github.ref_name }}.exe"
          else
            mv "dist/${{ env.APP_NAME }}" "release/${{ env.APP_NAME }}_pyinstaller_Linux_${{ github.ref_name }}"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP_NAME }}_pyinstaller_${{ runner.os }}_${{ github.ref_name }}"
          path: release/*

  publish_release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: build_for_tag
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            collected/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
